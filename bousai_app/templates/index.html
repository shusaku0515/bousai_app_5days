{% extends "base.html" %}

{% block content %}
<style>
    .home-shell {
        width: min(100% - 32px, 920px);
        margin: 34px auto 64px;
    }

    .home-card {
        margin-bottom: 34px;
        padding: 28px;
        border: 1px solid rgba(230, 235, 242, .8);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 26px rgba(40, 70, 110, .08);
    }

    .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 20px;
        color: var(--primary);
        font-size: 24px;
        font-weight: 800;
    }

    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 12px;
    }

    .refresh-label {
        color: #26934b;
        font-size: 15px;
        white-space: nowrap;
    }

    .refresh-label::before { content: "↻"; margin-right: 7px; font-size: 22px; }

    .map-title::before { content: "📍"; margin-right: 9px; font-size: 21px; }
    .weather-title::before { content: "🌤️"; margin-right: 9px; font-size: 21px; }

    .weather-panel {
        padding: 22px;
        border-radius: 12px;
        background: #f7f9fc;
    }

    .weather-panel p { margin: 8px 0; color: var(--muted); }
    .weather-location { color: var(--text) !important; font-weight: 700; }
    .weather-location::first-letter { font-size: 19px; }
    .weather-panel ul { margin: 12px 0; padding-left: 22px; }
    .weather-panel li { color: #c23b3b; font-weight: 700; }
    .weather-panel .no-warning { color: #26934b; font-weight: 700; }
    .weather-panel .no-warning::before {
        content: "✓";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 19px;
        height: 19px;
        margin-right: 7px;
        border-radius: 50%;
        color: #fff;
        background: #26934b;
        font-size: 13px;
        font-weight: 800;
    }

    @media (max-width: 600px) {
        .home-shell { width: min(100% - 20px, 920px); margin-top: 20px; }
        .home-card { padding: 18px; margin-bottom: 20px; border-radius: 14px; }
        .section-heading { align-items: flex-start; flex-direction: column; font-size: 20px; margin-bottom: 15px; }
        #shelterMap { height: 280px; }
        .weather-panel { padding: 16px; }
    }
</style>

<div class="home-shell">
    <section class="home-card" aria-labelledby="map-heading">
        <h2 id="map-heading" class="section-heading"><span class="map-title">避難所マップ</span></h2>
        <div id="shelterMap"></div>
    </section>

    <section class="home-card" aria-labelledby="weather-heading">
        <h2 id="weather-heading" class="section-heading">
            <span class="weather-title">青森市 気象警報・注意報</span>
            <span class="refresh-label">10分おき自動更新</span>
        </h2>
        <div id="weatherContent" class="weather-panel">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="no-warning">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p>◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p>◒ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
