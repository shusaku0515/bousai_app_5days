{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

{% if error %}
  <p>{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    {% if success %}
      <span>{{ message }}</span><br>
    {% endif %}
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
